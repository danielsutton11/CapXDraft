spring:
  main:
    web-application-type: none
  datasource:
    # On Railway, reference the Postgres service's variables in this service:
    # PGHOST=${{Postgres.PGHOST}} PGPORT=${{Postgres.PGPORT}} etc.
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:railway}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
  sql:
    init:
      mode: always

draftbot:
  token: ${DISCORD_TOKEN:}
  torn-api-key: ${TORN_API_KEY:}

  # Shown in the board title: "<Faction> <event-name> Draft <year>". Leave blank for "<Faction> Draft <year>".
  event-name: Halloween

  # Channel holding one live attack scoreboard message per faction
  scoreboard-channel-id: 1560776893635239998

  # Encrypts stored faction API keys. Set once on Railway and never change it.
  key-encryption-secret: ${KEY_ENCRYPTION_SECRET:}

  # Shared captain role, given/taken by /setcaptains and /replacecaptain
  captain-role-id: 1422656496088514632

  # Category where team text + voice channels are created (all factions)
  team-category-id: 1560730618751352873

  # Extra roles that can see every team's channels, on top of the team's own role.
  # Empty = each team's channels are private to that team (its captain is in the team role).
  team-channel-role-ids: []

  # Max players a captain can queue
  max-queue: 5

  factions:
    - key: capacity-x
      name: Capacity X
      draft-role-id: 1424430443570139167
      leadership-role-id: 992535460524073031
      channel-id: 1560731504152154293
      torn-faction-id: 9357
    - key: med-x
      name: Med X
      draft-role-id: 1560725343386472501
      leadership-role-id: 1396532328100135015
      channel-id: 1560731618312720455
      torn-faction-id: 9528
    - key: phoenix-x
      name: Phoenix X
      draft-role-id: 1560725290391445576
      leadership-role-id: 1407409658561429615
      channel-id: 1560731570518757527
      torn-faction-id: 29107
    - key: helvete-x
      name: Helvete X
      draft-role-id: 1560725502904508506
